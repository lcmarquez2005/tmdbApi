<!-- app.html -->
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50">
    <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎬</span>
        <span class="text-white font-bold text-xl tracking-tight">CinéDB</span>
      </div>
      <div class="flex items-center gap-2">
        <a 
          routerLink="/buscar" 
          routerLinkActive="bg-blue-600 text-white"
          [routerLinkActiveOptions]="{exact: false}"
          class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-slate-700 transition font-medium text-sm"
        >
          🔍 Buscar Películas
        </a>
        <a 
          routerLink="/descubrir" 
          routerLinkActive="bg-blue-600 text-white"
          [routerLinkActiveOptions]="{exact: false}"
          class="px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-slate-700 transition font-medium text-sm"
        >
          🌍 Descubrir por Región
        </a>
      </div>
    </div>
  </nav>

  <!-- Contenido de las rutas -->
  <router-outlet></router-outlet>
</div>
