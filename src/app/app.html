<div class="min-h-screen bg-slate-950 text-white p-8">
  <div class="max-w-6xl mx-auto">
    
    <header class="text-center mb-12">
      <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">
        PREMIERES
      </h1>
      <p class="text-slate-400 mt-2 uppercase tracking-widest">Experiencia Cinematográfica</p>
    </header>

    @if (results.length === 0) {
      <div class="text-center p-20 border-2 border-dashed border-slate-800 rounded-3xl">
        <p class="text-slate-500">Esperando datos de la API...</p>
      </div>
    }

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (movie of results; track movie.id) {
        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col md:flex-row hover:border-red-500/50 transition-all">
          
          <div class="w-full md:w-40 h-60 md:h-auto shrink-0 bg-slate-800">
            @if (movie.poster_path) {
              <img [src]="imageBaseUrl + movie.poster_path" class="w-full h-full object-cover">
            }
          </div>

          <div class="p-6">
            <h2 class="text-xl font-bold mb-2">{{ movie.title }}</h2>
            <p class="text-slate-400 text-sm line-clamp-3 mb-4">{{ movie.overview }}</p>
            <div class="text-xs font-bold text-red-500 uppercase tracking-tighter">
              Calificación: {{ movie.vote_average }} ★
            </div>
          </div>

        </div>
      }
    </div>

  </div>
</div>
