<div class="min-h-screen bg-slate-950 text-white p-8 font-sans">
  <div class="max-w-5xl mx-auto">
    
    <header class="text-center mb-16">
      <h1 class="text-6xl font-black tracking-tighter bg-gradient-to-r from-red-500 to-orange-400 bg-clip-text text-transparent">
        PREMIERES
      </h1>
      <p class="text-slate-400 mt-4 text-lg font-light tracking-widest uppercase">Lo más destacado del entretenimiento</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      @for (movie of results; track movie.id) {
        <div class="group bg-slate-900 border border-slate-800 rounded-3xl p-8 hover:bg-slate-800 transition-all duration-300 shadow-2xl hover:-translate-y-2">
          
          <div class="flex justify-between items-start mb-6">
            <h2 class="text-2xl font-bold text-slate-100 group-hover:text-red-400 transition-colors">
              {{ movie.title }}
            </h2>
            <span class="bg-red-500/10 text-red-500 border border-red-500/20 px-3 py-1 rounded-full text-xs font-black">
              {{ movie.vote_average }} ★
            </span>
          </div>

          <p class="text-slate-400 leading-relaxed mb-6 text-sm line-clamp-3">
            {{ movie.overview || 'Sinopsis no disponible en este momento.' }}
          </p>

          <div class="flex items-center gap-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
            <span class="w-8 h-[1px] bg-slate-700"></span>
            Lanzamiento: {{ movie.release_date }}
          </div>

        </div>
      }

    </div>

  </div>
</div>
