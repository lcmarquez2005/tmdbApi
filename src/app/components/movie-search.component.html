<div class="max-w-4xl mx-auto p-8">
  <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">Buscar Películas</h1>

  <div class="flex gap-2 mb-8">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Busca una película..."
      class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <button 
      (click)="search()" 
      [disabled]="isLoading()"
      class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 transition"
    >
      Buscar
    </button>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-50 border-l-4 border-red-600 p-4 mb-6 rounded text-red-700">
      {{ errorMessage() }}
    </div>
  }

  @if (isLoading()) {
    <p class="text-center text-gray-600 text-lg">Cargando...</p>
  }

  @if (movies().length > 0) {
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Resultados ({{ movies().length }})</h2>
    <div class="space-y-4">
      @for (movie of movies(); track movie.id) {
        <div class="bg-white border border-gray-200 rounded-lg p-4 hover:shadow-lg transition">
          <h3 class="text-lg font-semibold text-blue-600">{{ movie.title }}</h3>
          <p class="text-sm text-gray-500 mb-2">{{ movie.release_date }}</p>
          <p class="text-gray-700 text-sm">{{ movie.overview }}</p>
        </div>
      }
    </div>
  }
</div>
